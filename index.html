<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Reseñas</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
}

body {

  font-family:
    Arial,
    sans-serif;

  background:
    transparent;

  color:
    #333333;

}

.contenedor {

  max-width:
    1000px;

  margin:
    0 auto;

  padding:
    10px;

}

.cabecera {

  text-align:
    center;

  margin-bottom:
    30px;

}

.titulo {

  font-size:
    30px;

  font-weight:
    600;

  margin-bottom:
    10px;

  color:
    #ffffff;

}

.estrellas-general {

  font-size:
    25px;

  letter-spacing:
    2px;

}

.media {

  font-size:
    22px;

  margin-top:
    6px;

  color:
    #ffffff;

}

.numero {

  font-size:
    15px;

  margin-top:
    5px;

  color:
    rgba(255,255,255,0.78);

}

.grid {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        280px,
        1fr
      )
    );

  gap:
    18px;

}

.testimonio {

  background:
    #ffffff;

  border-radius:
    16px;

  padding:
    22px;

  box-shadow:
    0 3px 14px
    rgba(
      0,
      0,
      0,
      0.08
    );

}

.estrellas {

  font-size:
    20px;

  letter-spacing:
    2px;

  margin-bottom:
    12px;

}

.comentario {

  font-size:
    16px;

  line-height:
    1.6;

  margin-bottom:
    14px;

  color:
    #333333;

}

.nombre {

  font-weight:
    600;

  color:
    #555555;

}

.categoria {

  font-size:
    13px;

  color:
    #888888;

  margin-top:
    8px;

}

.error {

  text-align:
    center;

  padding:
    30px;

  color:
    #777777;

}

@media (
  max-width: 600px
) {

  .titulo {

    font-size:
      24px;

  }

  .grid {

    grid-template-columns:
      1fr;

  }

}

</style>

</head>


<body>


<div class="contenedor">


  <div class="cabecera">


    <div
      class="titulo"
      id="titulo"
    >

      Lo que opinan nuestros clientes

    </div>


    <div class="estrellas-general">

      ⭐⭐⭐⭐⭐

    </div>


    <div
      class="media"
      id="media"
    >

      <strong>
        0.0/5
      </strong>

    </div>


    <div class="numero">

      Basado en
      <span id="numero">
        0
      </span>
      valoraciones

    </div>


  </div>


  <div
    class="grid"
    id="resenas"
  >

    <div class="error">

      Cargando reseñas...

    </div>

  </div>


</div>



<script>


/*************************************************
 * URL DE LA NUEVA IMPLEMENTACIÓN
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzd6r3TExpYvR1uesPRAbCgWlvUfEtuq8OLtQtXvVwfY058W-vbVhmHmMXhgoj43PcPnw/exec";



/*************************************************
 * OBTENER CATEGORÍA DESDE LA URL
 *************************************************/

const parametros =
  new URLSearchParams(
    window.location.search
  );


const categoriaSolicitada =
  parametros.get("categoria") ||
  "todas";



/*************************************************
 * CAMBIAR COLORES SEGÚN LA PÁGINA
 *************************************************/

if (
  categoriaSolicitada !== "todas"
) {

  document.getElementById(
    "titulo"
  ).style.color =
    "#333333";


  document.getElementById(
    "media"
  ).style.color =
    "#333333";


  document.querySelector(
    ".numero"
  ).style.color =
    "#777777";

}



/*************************************************
 * ESCAPAR HTML
 *************************************************/

function escapar(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    texto == null
      ? ""
      : String(texto);

  return div.innerHTML;

}



/*************************************************
 * CARGAR RESEÑAS
 *************************************************/

async function cargarResenas() {

  const contenedor =
    document.getElementById(
      "resenas"
    );


  try {


    /*
     * Construimos la URL.
     */

    let url =
      APPS_SCRIPT_URL +
      "?datos=1";


    /*
     * Si hay categoría,
     * la enviamos a Apps Script.
     */

    if (
      categoriaSolicitada !== "todas"
    ) {

      url +=
        "&categoria=" +
        encodeURIComponent(
          categoriaSolicitada
        );

    }


    /*
     * Pedimos los datos.
     */

    const respuesta =
      await fetch(
        url,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    if (
      !respuesta.ok
    ) {

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }


    /*
     * Convertimos la respuesta
     * en JSON.
     */

    const datos =
      await respuesta.json();


    console.log(
      "Datos recibidos:",
      datos
    );


    /*
     * Comprobamos si Apps Script
     * ha devuelto un error.
     */

    if (
      datos.error
    ) {

      throw new Error(
        datos.error
      );

    }


    /*
     * Mostramos las reseñas.
     */

    mostrarResenas(
      datos.resenas || []
    );


  }
  catch (error) {


    console.error(
      "Error cargando reseñas:",
      error
    );


    contenedor.innerHTML = `

      <div class="error">

        No se han podido cargar las reseñas.

      </div>

    `;

  }

}



/*************************************************
 * MOSTRAR RESEÑAS
 *************************************************/

function mostrarResenas(
  resenas
) {


  const contenedor =
    document.getElementById(
      "resenas"
    );


  /*
   * Número de reseñas.
   */

  const total =
    resenas.length;


  /*
   * Calcular media.
   */

  let suma =
    0;


  resenas.forEach(
    function(resena) {

      suma +=
        Number(
          resena.valoracion
        ) || 0;

    }
  );


  const media =
    total > 0
      ? (
          suma / total
        ).toFixed(1)
      : "0.0";


  /*
   * Actualizar media.
   */

  document.getElementById(
    "media"
  ).innerHTML =

    "<strong>" +
    escapar(media) +
    "/5</strong>";


  /*
   * Actualizar número.
   */

  document.getElementById(
    "numero"
  ).textContent =
    total;


  /*
   * Si no hay reseñas.
   */

  if (
    total === 0
  ) {

    contenedor.innerHTML = `

      <div class="testimonio">

        Todavía no hay
        valoraciones publicadas.

      </div>

    `;

    return;

  }


  /*
   * Limpiar contenedor.
   */

  contenedor.innerHTML =
    "";


  /*
   * Crear cada reseña.
   */

  resenas.forEach(
    function(resena) {


      const valoracion =
        Number(
          resena.valoracion
        ) || 0;


      let estrellas =
        "";


      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        estrellas +=

          i <= valoracion
            ? "⭐"
            : "☆";

      }


      let categoriaHTML =
        "";


      /*
       * En la página general
       * mostramos la categoría.
       */

      if (
        categoriaSolicitada ===
        "todas"
      ) {

        categoriaHTML = `

          <div class="categoria">

            ${escapar(
              resena.categoria ||
              "Reseñas"
            )}

          </div>

        `;

      }


      contenedor.innerHTML += `

        <div class="testimonio">

          <div class="estrellas">

            ${estrellas}

          </div>


          <div class="comentario">

            "${escapar(
              resena.experiencia
            )}"

          </div>


          <div class="nombre">

            — ${escapar(
              resena.nombre ||
              "Cliente"
            )}

          </div>


          ${categoriaHTML}

        </div>

      `;

    }
  );

}



/*************************************************
 * INICIAR
 *************************************************/

cargarResenas();


</script>


</body>

</html>
