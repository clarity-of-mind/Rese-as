<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Reseñas</title>


<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;
  padding: 0;
  width: 100%;

}


body {

  font-family:
    Arial,
    sans-serif;

  background:
    transparent;

  color:
    #333333;

}


/* =========================================
   CONTENEDOR
========================================= */

.contenedor {

  max-width:
    1000px;

  margin:
    0 auto;

  padding:
    10px;

}


/* =========================================
   CABECERA
========================================= */

.cabecera {

  text-align:
    center;

  margin-bottom:
    30px;

}


.titulo {

  font-size:
    30px;

  font-weight:
    600;

  margin-bottom:
    10px;

  color:
    #333333;

}


.estrellas-general {

  font-size:
    25px;

  letter-spacing:
    2px;

}


.media {

  font-size:
    22px;

  margin-top:
    6px;

}


.numero {

  font-size:
    15px;

  margin-top:
    5px;

  color:
    #777777;

}


/* =========================================
   GRID
========================================= */

.grid {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        280px,
        1fr
      )
    );

  gap:
    18px;

}


/* =========================================
   TARJETAS
========================================= */

.testimonio {

  background:
    #ffffff;

  border-radius:
    16px;

  padding:
    22px;

  box-shadow:
    0 3px 14px
    rgba(
      0,
      0,
      0,
      0.08
    );

}


.estrellas {

  font-size:
    20px;

  letter-spacing:
    2px;

  margin-bottom:
    12px;

}


.comentario {

  font-size:
    16px;

  line-height:
    1.6;

  margin-bottom:
    14px;

  color:
    #333333;

}


.nombre {

  font-weight:
    600;

  color:
    #555555;

}


.categoria {

  font-size:
    13px;

  color:
    #888888;

  margin-top:
    8px;

}


/* =========================================
   ERROR
========================================= */

.error {

  text-align:
    center;

  padding:
    30px;

  color:
    #777777;

}


/* =========================================
   MÓVIL
========================================= */

@media (
  max-width: 600px
) {

  .contenedor {

    padding:
      8px;

  }


  .titulo {

    font-size:
      24px;

  }


  .estrellas-general {

    font-size:
      22px;

  }


  .media {

    font-size:
      20px;

  }


  .grid {

    grid-template-columns:
      1fr;

    gap:
      14px;

  }


  .testimonio {

    padding:
      18px;

  }


  .comentario {

    font-size:
      15px;

  }

}

</style>

</head>


<body>


<div class="contenedor">


  <!-- =====================================
       CABECERA
  ====================================== -->

  <div class="cabecera">


    <div
      class="titulo"
      id="titulo"
    >

      Lo que opinan nuestros clientes

    </div>


    <div class="estrellas-general">

      ⭐⭐⭐⭐⭐

    </div>


    <div class="media">

      <strong id="media">

        0.0/5

      </strong>

    </div>


    <div class="numero">

      Basado en

      <span id="numero">
        0
      </span>

      valoraciones

    </div>


  </div>


  <!-- =====================================
       RESEÑAS
  ====================================== -->

  <div
    class="grid"
    id="resenas"
  >

    <div class="error">

      Cargando reseñas...

    </div>

  </div>


</div>



<script>

/* =========================================
   APPS SCRIPT
========================================= */

/*
 * NUEVA IMPLEMENTACIÓN PARA GITHUB
 */

const APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbws4fDg8WdoySnNBpMmhAqECnEnuBr3pubAmIYr7uhqR_HrqvAPETF2gB_fkgYos_8h6g/exec";


/* =========================================
   CATEGORÍA
========================================= */

const parametros =
new URLSearchParams(
  window.location.search
);


const categoriaSolicitada =
parametros.get("categoria") || "todas";


/* =========================================
   CALLBACK JSONP
========================================= */

/*
 * IMPORTANTE:
 *
 * Utilizamos exactamente el mismo nombre
 * que devuelve Apps Script:
 *
 * window.reseñasCallback(...)
 *
 */

window.reseñasCallback =
function(datos) {


  console.log(
    "Datos recibidos de Apps Script:",
    datos
  );


  if (
    !datos ||
    datos.error
  ) {

    console.error(
      "Apps Script devolvió un error:",
      datos
    );

    mostrarError();

    return;

  }


  const resenas =
    Array.isArray(
      datos.resenas
    )
      ? datos.resenas
      : [];


  mostrarResenas(
    resenas
  );

};


/* =========================================
   MOSTRAR ERROR
========================================= */

function mostrarError() {

  document.getElementById(
    "resenas"
  ).innerHTML = `

    <div class="error">

      No se han podido cargar
      las reseñas.

    </div>

  `;

}


/* =========================================
   MOSTRAR RESEÑAS
========================================= */

function mostrarResenas(
  resenas
) {


  const contenedor =
    document.getElementById(
      "resenas"
    );


  contenedor.innerHTML =
    "";


  /* ---------------------------------------
     FILTRAR CATEGORÍA
  --------------------------------------- */

  let resenasFiltradas =
    resenas;


  if (
    categoriaSolicitada !==
    "todas"
  ) {

    resenasFiltradas =
      resenas.filter(
        function(resena) {

          return (
            String(
              resena.categoria || ""
            ).trim()
            ===
            categoriaSolicitada
          );

        }
      );

  }


  /* ---------------------------------------
     TOTAL
  --------------------------------------- */

  const total =
    resenasFiltradas.length;


  /* ---------------------------------------
     MEDIA
  --------------------------------------- */

  let suma =
    0;


  resenasFiltradas.forEach(
    function(resena) {

      suma +=
        Number(
          resena.valoracion
        );

    }
  );


  let media =
    "0.0";


  if (
    total > 0
  ) {

    media =
      (
        suma / total
      ).toFixed(1);

  }


  document.getElementById(
    "media"
  ).textContent =
    media + "/5";


  document.getElementById(
    "numero"
  ).textContent =
    total;


  /* ---------------------------------------
     SIN RESEÑAS
  --------------------------------------- */

  if (
    total === 0
  ) {

    contenedor.innerHTML = `

      <div class="testimonio">

        Todavía no hay
        valoraciones publicadas.

      </div>

    `;

    return;

  }


  /* ---------------------------------------
     CREAR RESEÑAS
  --------------------------------------- */

  resenasFiltradas.forEach(
    function(resena) {


      const valoracion =
        Number(
          resena.valoracion
        );


      let estrellas =
        "";


      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        estrellas +=
          i <= valoracion
            ? "⭐"
            : "☆";

      }


      let categoriaHTML =
        "";


      if (
        categoriaSolicitada ===
        "todas"
      ) {

        categoriaHTML = `

          <div class="categoria">

            ${escapar(
              resena.categoria ||
              "Reseñas"
            )}

          </div>

        `;

      }


      contenedor.innerHTML += `

        <div class="testimonio">

          <div class="estrellas">

            ${estrellas}

          </div>


          <div class="comentario">

            "${escapar(
              resena.experiencia ||
              ""
            )}"

          </div>


          <div class="nombre">

            — ${escapar(
              resena.nombre ||
              "Cliente"
            )}

          </div>


          ${categoriaHTML}

        </div>

      `;

    }
  );

}


/* =========================================
   ESCAPAR HTML
========================================= */

function escapar(texto) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    texto;

  return div.innerHTML;

}


/* =========================================
   CARGAR RESEÑAS
========================================= */

function cargarResenas() {


  /*
   * Creamos un elemento SCRIPT.
   *
   * Esto permite utilizar JSONP.
   *
   * No utilizamos fetch().
   */

  const script =
    document.createElement(
      "script"
    );


  /* ---------------------------------------
     URL
  --------------------------------------- */

  let url =
    APPS_SCRIPT +
    "?datos=1";


  /* ---------------------------------------
     CATEGORÍA
  --------------------------------------- */

  if (
    categoriaSolicitada !==
    "todas"
  ) {

    url +=
      "&categoria=" +
      encodeURIComponent(
        categoriaSolicitada
      );

  }


  /* ---------------------------------------
     EVITAR CACHÉ
  --------------------------------------- */

  url +=
    "&t=" +
    Date.now();


  /* ---------------------------------------
     ASIGNAR URL
  --------------------------------------- */

  script.src =
    url;


  script.async =
    true;


  /* ---------------------------------------
     ERROR
  --------------------------------------- */

  script.onerror =
    function() {

      console.error(
        "No se pudo conectar con Apps Script."
      );

      mostrarError();

    };


  /* ---------------------------------------
     INSERTAR SCRIPT
  --------------------------------------- */

  document
    .body
    .appendChild(
      script
    );

}


/* =========================================
   INICIAR
========================================= */

cargarResenas();


</script>


</body>

</html>
